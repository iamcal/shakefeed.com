; PHP settings for shakefeed.com, read by PHP-FPM. Each [PATH=] section applies to the scripts
; in that directory and below (deeper ones last), as php_value in site.conf or .htaccess did
; under mod_php. Linked into /etc/php/8.3/fpm/conf.d as site-shakefeed.com.ini; after a change,
; `sudo systemctl reload php8.3-fpm`. See neuron7.md in /mnt/neuron-base, "Event MPM and
; PHP-FPM".

[PATH=/var/www/html/shakefeed.com/www]
; moved here from www/.htaccess on 2026-11-16
display_startup_errors = 1
display_errors = 1
html_errors = 1
